    <div class="main-container">
        <!-- Left Side - Feedback Form -->
        <div class="form-container">
            <div class="feedback-form">
                <h1>Share Your Feedback</h1>
                <div class="rating-container">
                    <div class="rating-faces">
                        <span class="face" data-rating="1">😞</span>
                        <span class="face" data-rating="2">😕</span>
                        <span class="face" data-rating="3">😊</span>
                        <span class="face" data-rating="4">😃</span>
                        <span class="face" data-rating="5">🤩</span>
                    </div>
                    <div class="rating-text">Select your experience</div>
                </div>
                
                <form id="feedbackForm">
                    <div class="input-group">
                        <input type="text" id="name" required>
                        <label for="name">Your Name</label>
                    </div>
                    
                    <div class="input-group">
                        <input type="email" id="email" required>
                        <label for="email">Your Email</label>
                    </div>
                    
                    <div class="input-group">
                        <textarea id="feedback" rows="5" required></textarea>
                        <label for="feedback">Your Feedback</label>
                    </div>
                    
                    <button type="submit" class="submit-btn">Submit Feedback</button>
                </form>
            </div>
        </div>

        <!-- Right Side - Feedback List -->
        <div class="feedback-list-container">
            <h2>Recent Feedbacks</h2>
            <div class="feedback-list" id="feedbackList">
                <!-- Feedback items will be added here dynamically -->
            </div>
        </div>
